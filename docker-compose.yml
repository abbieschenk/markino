services:
  app:
    build:
      context: .
    container_name: markino-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://markino:markino@postgres:5432/markino
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}

  migrate:
    build:
      context: .
    command: ["./node_modules/.bin/drizzle-kit", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://markino:markino@postgres:5432/markino

  postgres:
    image: postgres:17-alpine
    container_name: markino-postgres
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_DB: markino
      POSTGRES_USER: markino
      POSTGRES_PASSWORD: markino
    volumes:
      - markino-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markino -d markino"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  markino-postgres-data:
