services:
  app:
    build:
      context: .
    container_name: markino-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://markino:markino@postgres:5432/markino
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET before running docker compose}
      MARKINO_SIGNUPS_ENABLED: ${MARKINO_SIGNUPS_ENABLED:-false}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}

  postgres:
    image: postgres:17-alpine
    container_name: markino-postgres
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_DB: markino
      POSTGRES_USER: markino
      POSTGRES_PASSWORD: markino
    volumes:
      - markino-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markino -d markino"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  markino-postgres-data:
